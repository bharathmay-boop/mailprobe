name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install .

      # The tests cover address format rules, how server replies map to a
      # status, and the local web interface. None of them send traffic to a
      # mail server, which matters because CI runners block outbound port 25.
      - name: Run tests
        run: python test_mailprobe.py
