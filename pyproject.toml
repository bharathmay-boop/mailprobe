[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mailprobe"
version = "0.3.0"
description = "Check whether an email address can actually receive mail, and say so honestly when it cannot be determined."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Bharath N Balakrishna" }]
keywords = ["email", "validation", "verification", "smtp", "deliverability"]
dependencies = ["dnspython>=2.4"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
]

[project.urls]
Homepage = "https://github.com/bharathmay-boop/mailprobe"
Issues = "https://github.com/bharathmay-boop/mailprobe/issues"

[project.scripts]
mailprobe = "mailprobe:main"

[tool.setuptools]
py-modules = ["mailprobe"]
